name: Publish Ubuntu amd64 image

on:
  push:
    branches: [cooper]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build
        required: true
        default: cooper
        type: string

concurrency:
  group: branch-image-${{ github.event.inputs.branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish linux/amd64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Prepare image tags and version
        id: version
        env:
          BRANCH_NAME: ${{ github.event.inputs.branch || github.ref_name }}
        run: |
          TAG_PREFIX=$(printf '%s' "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')
          TAG_PREFIX=${TAG_PREFIX:0:105}
          TAG_PREFIX=$(printf '%s' "$TAG_PREFIX" | sed -E 's/[.-]+$//')
          if [ -z "$TAG_PREFIX" ]; then
            echo "::error::Branch cannot be converted to a valid Docker tag"
            exit 1
          fi
          VERSION="${TAG_PREFIX}-$(date -u +'%Y%m%d')-$(git rev-parse --short HEAD)"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$VERSION" > VERSION
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "branch_tag=$TAG_PREFIX" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.version.outputs.image }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.branch_tag }}
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Output image references
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          BRANCH_TAG: ${{ steps.version.outputs.branch_tag }}
          VERSION_TAG: ${{ steps.version.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo '### Ubuntu-compatible image (linux/amd64)' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE:$BRANCH_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE:$VERSION_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
